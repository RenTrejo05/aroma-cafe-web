<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Aroma Café</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/login.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark">A</span><span>Aroma Café</span></a>
    <nav aria-label="Main navigation"><a href="../index.html">Home</a><a href="menu.html">Menu</a><a href="login.html" aria-current="page">Login</a><a href="contact.html">Contact</a></nav>
  </header>
  <main class="page-shell">
    <section class="page-heading">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Good to see you.</h1>
      <p class="hero-copy">Sign in to keep your Aroma Café favorites close.</p>
    </section>
    <form class="form-card" id="login-form">
      <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required></div>
      <button class="button" type="submit">Sign in <span aria-hidden="true">→</span></button>
      <p class="form-note">Demo only: this page validates the form in your browser and does not authenticate against a server.</p>
      <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer class="site-footer"><span>© 2026 Aroma Café</span><span>Here’s to your next favorite cup.</span></footer>
</body>
</html>
